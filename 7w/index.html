<!DOCTYPE html>
<html lang="ko">
<head>
    <title>머신러닝 서비스</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="./mltest_files/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="./mltest_files/tf.min.js"></script>
    <script src="./mltest_files/teachablemachine-image.min.js"></script>
    <link rel="stylesheet" href="./mltest_files/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="./mltest_files/style.css">
</head>

<body>
    <header class="site-header wrap">
        <div class="brand"><span class="brand-mark">✨</span> 머신러닝 서비스</div>
    </header>

    <section class="hero wrap">
        <h1>AI <em>닮은꼴</em> 테스트</h1>
        <p>사진 한 장으로 알아보는 인공지능 사진 분류</p>
        <div class="badges">
            <span class="badge">무료</span>
            <span class="badge">개인정보 안전</span>
            <span class="badge">빠른 분석</span>
        </div>
    </section>

    <main class="wrap">
        <div class="card file-upload">
            <div class="image-upload-wrap">
                <input class="file-upload-input" type="file" onchange="readURL(this);" accept="image/*">
                <div class="drag-text">
                    <img src="./mltest_files/upload.png" class="upload" alt="upload-image">
                    <h3 class="upload-title">얼굴 사진을 선택하세요!</h3>
                    <span class="pick-btn">사진 선택하기</span>
                    <p class="upload-hint">끌어다 놓거나 눌러서 업로드 • JPG, PNG 지원</p>
                </div>
            </div>
            <div class="file-upload-content">
                <img class="file-upload-image" id="face-image" alt="your image">
                <div id="loading">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <p class="text-center">AI가 사진을 분석중입니다.</p>
                </div>
                <div class="result-message"></div>
                <div id="label-container" class="d-flex flex-column justify-content-around"></div>
                <button type="button" class="try-again-btn" onclick="gaReload()">다른 사진으로 재시도</button>
            </div>
            <p class="privacy">🔒 사진은 서버에 저장되지 않고 브라우저에서만 분석됩니다.</p>
        </div>
    </main>

    <footer class="footer wrap">
        <p>© 수원대학교 빅데이터분석. All Rights Reserved.</p>
        <p><a href="https://www.youtube.com/channel/UCQNE2JmbasNYbjGAcuBiRRg">제작 도움: 조코딩 유튜브 채널</a></p>
    </footer>
    <script>
        function gaReload() {
            window.location.reload();
        }

        function readURL(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    $('.image-upload-wrap').hide();
                    $('#loading').show();
                    $('.file-upload-image').attr('src', e.target.result);
                    $('.file-upload-content').show();
                    $('.image-title').html(input.files[0].name);
                };
                reader.readAsDataURL(input.files[0]);
                init().then(function() {
                    console.log("hello");
                    predict();
                    $('#loading').hide();
                });
            } else {
                removeUpload();
            }
        }

        function removeUpload() {
            $('.file-upload-input').replaceWith($('.file-upload-input').clone());
            $('.file-upload-content').hide();
            $('.image-upload-wrap').show();
        }
        $('.image-upload-wrap').bind('dragover', function() {
            $('.image-upload-wrap').addClass('image-dropping');
        });
        $('.image-upload-wrap').bind('dragleave', function() {
            $('.image-upload-wrap').removeClass('image-dropping');
        });
    </script>
    <script>
        let model, webcam, labelContainer, maxPredictions;
        async function init() {
            const modelURL = "./mltest_files/model.json";
            const metadataURL = "./mltest_files/metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                var element = document.createElement("div")
                element.classList.add("d-flex");
                labelContainer.appendChild(element);
            }
        }

        async function predict() {
            var dic_class2information = {};
            dic_class2information['나연'] = 'JYP엔터테인먼트 소속 9인조 그룹 TWICE의 멤버';
            dic_class2information['장원영'] = '스타쉽엔터테인먼트 소속 6인조 걸그룹 IVE의 멤버.';
            dic_class2information['제니'] = 'YG엔터테인먼트 소속 4인조 걸그룹 BLACKPINK의 메인래퍼이자 리드보컬';
            var image = document.getElementById("face-image");
            const prediction = await model.predict(image, false);
            prediction.sort((a, b) => parseFloat(b.probability) - parseFloat(a.probability));
            console.log(prediction[0].className);
            var resultTitle, resultExplain;
            if (prediction[0].className in dic_class2information){
                resultTitle = prediction[0].className;
                resultExplain = dic_class2information[prediction[0].className];
            } else{
                resultTitle = "알수없음";
                resultExplain = "";
            }
            var colors = ['#75cc54', '#1baeea', '#fbb03b', '#c38c66', '#31849b', '#eba6be'];
            $('.result-message').html(
                "<div class='result-label'>분석 결과</div>" +
                "<div class='animal-title'>" + resultTitle + "</div>" +
                "<div class='animal-explain'>" + resultExplain + "</div>");
            for (let i = 0; i < maxPredictions; i++) {
                var p = prediction[i].probability;
                var pct = Math.round(p * 100);
                var barWidth = Math.max(pct, 6) + "%";
                var c = colors[i % colors.length];
                labelContainer.childNodes[i].innerHTML =
                    "<div class='row-item' style='--c:" + c + "'>" +
                    "<div class='animal-label'>" + prediction[i].className + "</div>" +
                    "<div class='bar-container'><div class='bar-box'></div>" +
                    "<div class='bar' style='width:" + barWidth + "'><span class='percent-text'>" + pct + "%</span></div></div></div>";
            }
        }

        window.dataLayer = window.dataLayer || [];
    </script>
